<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="596" viewBox="0 0 1200 596">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="596" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionBeacon - one election cycle</text>
  <text class="subtitle" x="40" y="78">The hosted loop calls TryElectAsync every RenewInterval; the store's answer sets IsLeader and fires a transition only when it changes.</text>

  <!-- loop -->
  <circle class="badge" cx="40" cy="190" r="12"/>
  <text class="badge-text" x="40" y="194" text-anchor="middle">1</text>
  <rect class="step" x="40" y="200" width="220" height="80" rx="14"/>
  <text class="label" x="150" y="232" text-anchor="middle">LeaderElectionService</text>
  <text class="small" x="150" y="256" text-anchor="middle">calls TryElectAsync</text>

  <path class="flow" d="M260,240 L298,240"/>

  <!-- store call -->
  <circle class="badge" cx="300" cy="190" r="12"/>
  <text class="badge-text" x="300" y="194" text-anchor="middle">2</text>
  <rect class="step" x="300" y="200" width="250" height="80" rx="14"/>
  <text class="code" x="425" y="230" text-anchor="middle">TryAcquireOrRenewAsync</text>
  <text class="small" x="425" y="251" text-anchor="middle">ResourceName, CandidateId,</text>
  <text class="small" x="425" y="269" text-anchor="middle">LeaseDuration</text>

  <path class="flow" d="M550,240 L598,240"/>

  <!-- decision -->
  <polygon class="decision" points="690,170 780,240 690,310 600,240"/>
  <text class="code" x="690" y="237" text-anchor="middle">Outcome</text>
  <text class="small" x="690" y="257" text-anchor="middle">attempt counted</text>

  <!-- held -->
  <path class="flow" d="M690,170 L690,130 L838,130"/>
  <text class="edge" x="764" y="120" text-anchor="middle">Acquired / Renewed</text>
  <rect class="ok" x="840" y="90" width="330" height="84" rx="14"/>
  <text class="label" x="1005" y="120" text-anchor="middle">Leader: IsLeader = true</text>
  <text class="small" x="1005" y="142" text-anchor="middle">Lease carries the fencing token</text>
  <text class="small" x="1005" y="162" text-anchor="middle">gained it: OnElected(lease), "elected"</text>

  <!-- denied -->
  <path class="flow" d="M690,310 L690,350 L838,350"/>
  <text class="edge" x="764" y="340" text-anchor="middle">Denied</text>
  <rect class="step" x="840" y="308" width="330" height="84" rx="14"/>
  <text class="label" x="1005" y="338" text-anchor="middle">Follower: IsLeader = false</text>
  <text class="small" x="1005" y="360" text-anchor="middle">Lease = null</text>
  <text class="small" x="1005" y="380" text-anchor="middle">lost it: OnDeposed(resource), "deposed"</text>

  <!-- store fault -->
  <path class="flow alt" d="M425,280 L425,358"/>
  <text class="edge" x="435" y="324">store throws</text>
  <rect class="fail" x="300" y="360" width="250" height="70" rx="14"/>
  <text class="label" x="425" y="389" text-anchor="middle">Fault swallowed by loop</text>
  <text class="small" x="425" y="411" text-anchor="middle">IsLeader and Lease unchanged</text>

  <!-- wait and repeat -->
  <path class="flow" d="M1170,132 L1185,132 L1185,465 L262,465"/>
  <path class="flow" d="M1005,392 L1005,462"/>
  <path class="flow alt" d="M425,430 L425,462"/>
  <text class="edge" x="760" y="456" text-anchor="middle">every path waits, then runs the next cycle</text>
  <rect class="step" x="40" y="430" width="220" height="70" rx="14"/>
  <text class="code" x="150" y="460" text-anchor="middle">Task.Delay(</text>
  <text class="code" x="150" y="480" text-anchor="middle">RenewInterval)</text>
  <path class="flow back" d="M150,430 L150,282"/>
  <text class="edge" x="160" y="360">next cycle</text>

  <!-- shutdown note -->
  <rect class="note" x="40" y="516" width="1130" height="50" rx="10"/>
  <text class="small" x="60" y="546">On shutdown StopAsync calls ResignAsync: ReleaseAsync frees the lease, IsLeader turns false and OnDeposed fires, so a follower wins its next cycle.</text>
</svg>
